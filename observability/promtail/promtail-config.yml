# Promtail configuration: ships Docker logs of the Modern Dicompyler containers
# to Loki. Parses the application's structured JSON log lines so that
# level / event / trace_id become queryable fields in Grafana.
server:
  http_listen_port: 9080

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Normalise the container name label: "/modern-dicompyler-api" -> "modern-dicompyler-api".
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Keep only Modern Dicompyler containers (api + dashboard).
      - source_labels: ["container"]
        regex: "modern-dicompyler-(api|dashboard)"
        action: keep
    pipeline_stages:
      # The api service emits multi-stream output; parse only JSON lines and
      # silently keep plain lines (e.g. uvicorn access logs) unparsed.
      - json:
          expressions:
            level: level
            event: event
            message: message
            trace_id: trace_id
            route: route
            status_code: status_code
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          action_on_failure: skip
