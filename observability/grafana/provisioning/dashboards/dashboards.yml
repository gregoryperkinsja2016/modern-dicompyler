# Grafana dashboard provider: loads the pre-built Modern Dicompyler dashboard.
apiVersion: 1

providers:
  - name: modern-dicompyler
    orgId: 1
    folder: Modern Dicompyler
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
