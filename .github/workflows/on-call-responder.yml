name: On-call responder

# Triggered when an issue is labelled `on-call` (see src/alerting.py).
# This workflow runs diagnostics and comments on the issue. It never deploys,
# never pushes code, never deletes issues, and never modifies secrets.

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  respond:
    if: github.event.label.name == 'on-call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run diagnostics and comment on the issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DEPLOYMENT_URL: ${{ secrets.DEV_API_URL }}
          KNOWN_GOOD_IMAGE_TAG: ${{ secrets.KNOWN_GOOD_IMAGE_TAG }}
        run: python scripts/on_call_diagnose.py --post-comment
